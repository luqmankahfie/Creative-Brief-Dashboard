<script>
// ============================================================
// PEOPLESHIFT DESIGN PORTAL — App.js.html
// SPA Frontend — Google Apps Script compatible (no ES modules)
// ============================================================

// ---- STATE --------------------------------------------------
var APP = {
  user: null,
  requests: [],
  currentPage: 'dashboard',
  currentRequest: null,
  form: {
    step: 0,
    data: {},
    slides: [],
    files: []
  },
  filters: { status: 'all', search: '' },
  analytics: null,
  toasts: [],
  loading: false
};

// ---- BOOTSTRAP ----------------------------------------------
window.addEventListener('load', function () {
  google.script.run
    .withSuccessHandler(function (info) {
      APP.user = info;
      if (info.role === 'unauthorized') {
        renderUnauthorized();
      } else {
        renderApp();
        loadRequests();
      }
      setTimeout(hideSplash, 600);
    })
    .withFailureHandler(function (err) {
      showToast('Gagal memuat profil: ' + err.message, 'error');
      setTimeout(hideSplash, 800);
    })
    .getUserInfo();
});

function hideSplash() {
  var s = document.getElementById('splash');
  if (s) { s.classList.add('fade-out'); setTimeout(function(){ s.remove(); }, 400); }
}

// ---- RENDER SHELL -------------------------------------------
function renderUnauthorized() {
  document.getElementById('app-root').innerHTML =
    '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#1A1A1A;">' +
    '<div style="text-align:center;color:#fff;padding:40px;">' +
    '<div style="font-size:48px;margin-bottom:16px;">🔒</div>' +
    '<h2 style="font-size:22px;margin-bottom:8px;">Akses Ditolak</h2>' +
    '<p style="color:#999;">Email kamu tidak terdaftar. Hubungi tim Ops Peopleshift.</p>' +
    '</div></div>';
}

function renderApp() {
  var roleLabel = { requester: 'Requester', designer: 'Designer', pm: 'PM', designer_pm: 'Designer + PM' };
  var roleClass = 'role-' + APP.user.role;
  var initials  = (APP.user.name || 'U').charAt(0).toUpperCase();

  var sidebar = [
    '<div class="sidebar">',
    '  <div class="sidebar-logo">',
    '    <svg width="32" height="32" viewBox="0 0 48 48" fill="none"><rect width="48" height="48" rx="10" fill="#FF5E14"/><path d="M10 34L24 14L38 34" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24" cy="14" r="3" fill="white"/></svg>',
    '    <div class="sidebar-logo-text">PeopleShift<div class="sidebar-logo-sub">Design Portal</div></div>',
    '  </div>',
    '  <div class="sidebar-user">',
    '    <div class="sidebar-avatar">' + initials + '</div>',
    '    <div class="sidebar-user-info">',
    '      <div class="sidebar-user-name">' + (APP.user.name || APP.user.email.split('@')[0]) + '</div>',
    '      <span class="sidebar-user-role ' + roleClass + '">' + (roleLabel[APP.user.role] || APP.user.role) + '</span>',
    '    </div>',
    '  </div>',
    '  <nav class="sidebar-nav">',
    navItem('dashboard', '📊', 'Dashboard'),
    navItem('new-request', '✏️', 'Buat Request'),
    APP.user.isDesigner ? navItem('designer-queue', '🎨', 'Designer Queue') : '',
    APP.user.isPM ? navItem('pm-analytics', '📈', 'PM Analytics') : '',
    navItem('brand-assets', '🏷️', 'Brand Assets'),
    '  </nav>',
    '</div>'
  ].join('');

  var toastContainer = '<div class="toast-container" id="toast-container"></div>';

  document.getElementById('app-root').innerHTML =
    '<div id="app">' +
    sidebar +
    '<div class="main">' +
    '<div class="topbar"><div class="topbar-title" id="topbar-title">Dashboard</div>' +
    '<div class="topbar-actions">' +
    '<div class="search-bar"><span class="search-icon">🔍</span><input id="search-input" placeholder="Cari request..." oninput="onSearch(this.value)"></div>' +
    '</div></div>' +
    '<div class="page-content" id="page-content"></div>' +
    '</div>' +
    '</div>' + toastContainer;

  navigateTo('dashboard');
}

function navItem(page, icon, label) {
  return '<div class="nav-item" id="nav-' + page + '" onclick="navigateTo(\'' + page + '\')">' +
         '<span class="nav-icon">' + icon + '</span>' + label + '</div>';
}

// ---- ROUTER -------------------------------------------------
function navigateTo(page) {
  APP.currentPage = page;
  document.querySelectorAll('.nav-item').forEach(function(el){ el.classList.remove('active'); });
  var navEl = document.getElementById('nav-' + page);
  if (navEl) navEl.classList.add('active');

  var titles = {
    dashboard: 'Dashboard', 'new-request': 'Buat Request Baru',
    'designer-queue': 'Designer Queue', 'pm-analytics': 'PM Analytics',
    'brand-assets': 'Brand Assets', 'request-detail': 'Detail Request'
  };
  var tb = document.getElementById('topbar-title');
  if (tb) tb.textContent = titles[page] || page;

  if (page === 'dashboard')       renderDashboard();
  else if (page === 'new-request')     renderNewRequestForm();
  else if (page === 'designer-queue')  renderDesignerQueue();
  else if (page === 'pm-analytics')    renderPMAnalytics();
  else if (page === 'brand-assets')    renderBrandAssets();
  else if (page === 'request-detail')  renderRequestDetail();
}

// ---- LOAD REQUESTS ------------------------------------------
function loadRequests(cb) {
  APP.loading = true;
  google.script.run
    .withSuccessHandler(function(data) {
      APP.loading = false;
      APP.requests = data || [];
      if (cb) cb();
      else if (APP.currentPage === 'dashboard') renderDashboard();
      else if (APP.currentPage === 'designer-queue') renderDesignerQueue();
    })
    .withFailureHandler(function(e) {
      APP.loading = false;
      showToast('Gagal memuat data: ' + e.message, 'error');
    })
    .getMyRequests();
}

// ---- DASHBOARD PAGE -----------------------------------------
function renderDashboard() {
  var all = APP.requests;
  var filtered = filterRequests(all);

  var todo   = all.filter(function(r){ return r.status === 'To Do'; }).length;
  var ip     = all.filter(function(r){ return r.status === 'In Progress'; }).length;
  var done   = all.filter(function(r){ return r.status === 'Done'; }).length;
  var rev    = all.filter(function(r){ return r.status === 'Revision'; }).length;

  var html = [
    '<div class="stats-grid">',
    statCard('📋', todo,  'To Do',      'stat-card-todo'),
    statCard('⚙️', ip,   'In Progress', 'stat-card-ip'),
    statCard('✅', done, 'Done',        'stat-card-done'),
    statCard('🔄', rev,  'Revision',    'stat-card-rev'),
    '</div>',

    '<div class="card">',
    '<div class="card-header">',
    '  <span class="card-title">Semua Request</span>',
    '  <div style="display:flex;gap:8px;">',
    filterChip('all', 'Semua'),
    filterChip('To Do', 'To Do'),
    filterChip('In Progress', 'In Progress'),
    filterChip('Done', 'Done'),
    filterChip('Revision', 'Revision'),
    (APP.user.role === 'requester' ? '<button class="btn btn-primary btn-sm" onclick="navigateTo(\'new-request\')">+ Buat Request</button>' : ''),
    '  </div>',
    '</div>',
    '<div style="overflow-x:auto;">',
    renderRequestTable(filtered),
    '</div>',
    '</div>'
  ].join('');

  document.getElementById('page-content').innerHTML = html;
}

function statCard(icon, val, label, cls) {
  return '<div class="stat-card ' + cls + '">' +
         '<div class="stat-icon">' + icon + '</div>' +
         '<div class="stat-value">' + val + '</div>' +
         '<div class="stat-label">' + label + '</div></div>';
}

function filterChip(val, label) {
  var active = APP.filters.status === val ? ' active' : '';
  return '<div class="filter-chip' + active + '" onclick="setFilter(\'' + val + '\')">' + label + '</div>';
}

function setFilter(val) {
  APP.filters.status = val;
  renderDashboard();
}

function onSearch(val) {
  APP.filters.search = val.toLowerCase();
  if (APP.currentPage === 'dashboard') renderDashboard();
  else if (APP.currentPage === 'designer-queue') renderDesignerQueue();
}

function filterRequests(list) {
  return list.filter(function(r) {
    var matchStatus = APP.filters.status === 'all' || r.status === APP.filters.status;
    var q = APP.filters.search;
    var matchSearch = !q ||
      (r.nama_project || '').toLowerCase().includes(q) ||
      (r.request_id   || '').toLowerCase().includes(q) ||
      (r.pic_name     || '').toLowerCase().includes(q) ||
      (r.divisi       || '').toLowerCase().includes(q);
    return matchStatus && matchSearch;
  });
}

function renderRequestTable(requests) {
  if (!requests || requests.length === 0) {
    return '<div class="empty-state"><div class="empty-icon">📭</div>' +
           '<div class="empty-title">Belum ada request</div>' +
           '<div class="empty-desc">Request design akan muncul di sini</div></div>';
  }

  var rows = requests.map(function(r) {
    var brands = parseBrand(r.brand);
    var brandPills = brands.map(function(b){ return '<span class="brand-pill">' + b + '</span>'; }).join('');
    var bclass = badgeClass(r.status);
    var deadline = r.deadline_output ? formatDate(r.deadline_output) : '-';
    var overdue  = r.deadline_output && r.status !== 'Done' && new Date(r.deadline_output) < new Date()
      ? ' style="color:#e53e3e;font-weight:700;"' : '';

    return '<tr onclick="openRequest(\'' + r.request_id + '\')">' +
      '<td><div class="table-id">' + (r.request_id || '-') + '</div></td>' +
      '<td><div class="table-project-name">' + esc(r.nama_project || '-') + '</div>' +
           '<div style="font-size:11px;color:#999;">' + esc(r.divisi || '') + '</div></td>' +
      '<td><div class="table-brand">' + brandPills + '</div></td>' +
      '<td>' + esc(r.pic_name || '-') + '</td>' +
      '<td' + overdue + '>' + deadline + '</td>' +
      '<td>' + priorityBadge(r.priority) + '</td>' +
      '<td><span class="badge ' + bclass + '">' + (r.status || 'To Do') + '</span></td>' +
      '<td>' + esc(r.assigned_to ? r.assigned_to.split('@')[0] : '-') + '</td>' +
      '</tr>';
  }).join('');

  return '<table class="request-table">' +
    '<thead><tr>' +
    '<th>ID</th><th>Project</th><th>Brand</th><th>Requester</th>' +
    '<th>Deadline</th><th>Priority</th><th>Status</th><th>Designer</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table>';
}

// ---- REQUEST DETAIL PAGE ------------------------------------
function openRequest(id) {
  APP.loading = true;
  document.getElementById('page-content').innerHTML = '<div class="loading-wrap"><div class="spinner"></div> Memuat detail...</div>';

  APP.currentPage = 'request-detail';
  document.querySelectorAll('.nav-item').forEach(function(el){ el.classList.remove('active'); });
  var tb = document.getElementById('topbar-title');
  if (tb) tb.textContent = 'Detail Request';

  google.script.run
    .withSuccessHandler(function(r) {
      APP.loading = false;
      APP.currentRequest = r;
      renderRequestDetail();
    })
    .withFailureHandler(function(e) {
      APP.loading = false;
      showToast('Gagal memuat detail: ' + e.message, 'error');
    })
    .getRequestDetail(id);
}

function renderRequestDetail() {
  var r = APP.currentRequest;
  if (!r) { navigateTo('dashboard'); return; }

  var brands   = parseBrand(r.brand);
  var brandsStr = brands.join(', ') || '-';
  var bclass   = badgeClass(r.status);
  var delivs   = parseJSON(r.deliverables) || [];
  var platform = parseJSON(r.platform) || [];
  var mood     = parseJSON(r.mood_feeling) || [];
  var driveFiles = parseJSON(r.drive_files) || [];
  var slides   = r.carousel_slides || [];
  var history  = r.status_history || [];
  var comments = r.comments || [];

  // Deliverables section
  var delivHtml = delivs.map(function(d) {
    var type = typeof d === 'object' ? d.type : d;
    return '<span style="background:#f0f0f0;padding:3px 10px;border-radius:6px;font-size:12px;margin:2px;display:inline-block;">' + esc(type) + '</span>';
  }).join('');

  // Carousel slides
  var slidesHtml = '';
  if (slides.length > 0) {
    slidesHtml = slides.map(function(s, i) {
      return '<div style="background:#f9f9f9;border:1px solid #eee;border-radius:8px;padding:12px;margin-bottom:8px;">' +
        '<div style="font-size:11px;font-weight:700;color:#FF5E14;margin-bottom:6px;">SLIDE ' + (s.slide_number || (i+1)) + ' — ' + esc(s.slide_type || '') + '</div>' +
        (s.headline ? '<div><strong>' + esc(s.headline) + '</strong></div>' : '') +
        (s.body_text ? '<div style="font-size:12px;color:#555;margin-top:4px;">' + esc(s.body_text) + '</div>' : '') +
        (s.visual_direction ? '<div style="font-size:11px;color:#999;margin-top:4px;">Visual: ' + esc(s.visual_direction) + '</div>' : '') +
        '</div>';
    }).join('');
  }

  // Status timeline
  var timelineHtml = history.map(function(h) {
    var dotClass = statusDotClass(h.new_status);
    return '<div class="timeline-item">' +
      '<div class="timeline-dot ' + dotClass + '">✓</div>' +
      '<div class="timeline-content">' +
      '<div class="timeline-title">' + esc(h.old_status || 'Dibuat') + ' → ' + esc(h.new_status) + '</div>' +
      '<div class="timeline-meta">' + esc(h.changed_by || '') + ' • ' + formatDatetime(h.timestamp) + '</div>' +
      (h.notes ? '<div style="font-size:12px;color:#555;margin-top:2px;">' + esc(h.notes) + '</div>' : '') +
      '</div></div>';
  }).join('') || '<p style="color:#999;font-size:13px;">Belum ada riwayat.</p>';

  // Comments
  var commentsHtml = comments.map(function(c) {
    var isRev = c.is_revision === 'true' || c.is_revision === true;
    var initials = (c.author_name || 'U').charAt(0).toUpperCase();
    return '<div class="comment-item' + (isRev ? ' revision' : '') + '">' +
      '<div class="comment-header">' +
      '<div class="comment-avatar">' + initials + '</div>' +
      '<span class="comment-author">' + esc(c.author_name || '') + '</span>' +
      (isRev ? '<span class="comment-revision-tag">🔄 Revisi</span>' : '') +
      '<span class="comment-time">' + formatDatetime(c.timestamp) + '</span>' +
      '</div>' +
      '<div class="comment-body">' + esc(c.content || '') + '</div>' +
      '</div>';
  }).join('') || '<p style="color:#999;font-size:13px;text-align:center;padding:16px;">Belum ada komentar.</p>';

  // Designer/PM controls
  var designerControls = '';
  if (APP.user.isDesigner || APP.user.isPM) {
    var statusOpts = ['To Do','In Progress','Done','Revision'].map(function(s) {
      var key = s.toLowerCase().replace(' ', '');
      var selClass = r.status === s ? ' selected-' + key : '';
      return '<div class="status-option' + selClass + '" onclick="quickUpdateStatus(\'' + r.request_id + '\',\'' + s + '\')">' + s + '</div>';
    }).join('');

    designerControls = '<div class="card"><div class="card-header"><span class="card-title">🎨 Designer Controls</span></div>' +
      '<div class="card-body">' +
      '<p style="font-size:12px;color:#999;margin-bottom:8px;">Update Status:</p>' +
      '<div class="status-select-grid">' + statusOpts + '</div>' +
      '<div class="output-submit" id="output-form">' +
      '<p style="font-size:12px;font-weight:700;color:#38a169;margin-bottom:10px;">✅ Submit Output</p>' +
      '<input class="form-control" id="output-link-input" placeholder="Link Google Drive / Canva..." style="margin-bottom:8px;">' +
      '<textarea class="form-control" id="output-notes-input" placeholder="Catatan tambahan (opsional)..." style="min-height:60px;margin-bottom:8px;"></textarea>' +
      '<button class="btn btn-primary btn-sm" onclick="submitOutput(\'' + r.request_id + '\')">Kirim ke Requester</button>' +
      '</div></div></div>';
  }

  // Output link
  var outputHtml = '';
  if (r.output_link) {
    outputHtml = '<div style="background:#f0fff4;border:1.5px solid #68d391;border-radius:10px;padding:16px;text-align:center;">' +
      '<p style="font-size:12px;font-weight:700;color:#38a169;margin-bottom:8px;">✅ Output Tersedia</p>' +
      '<a href="' + r.output_link + '" target="_blank" class="btn btn-primary">Buka Hasil Design ↗</a>' +
      '</div>';
  }

  // Drive files
  var driveHtml = driveFiles.length > 0 ? driveFiles.map(function(f) {
    return '<a href="' + f.url + '" target="_blank" class="file-chip">' +
           '📎 ' + esc(f.name) + '</a>';
  }).join('') : '';

  // Revision button (for requester when output exists)
  var revisionBtn = '';
  if (!APP.user.isDesigner && r.output_link) {
    revisionBtn = '<button class="btn btn-outline btn-sm" onclick="showRevisionPanel()">🔄 Minta Revisi</button>';
  }

  // Multiple version indicator
  var multiVersi = '';
  if (r.butuh_multiple_versi === 'true') {
    var versi = parseJSON(r.versi_brand) || [];
    multiVersi = '<div style="background:#fff0e8;border:1px solid rgba(255,94,20,.3);border-radius:8px;padding:10px 14px;margin-bottom:12px;">' +
      '<span style="font-size:12px;font-weight:700;color:#FF5E14;">🔀 Multiple Versi: </span>' +
      versi.join(' + ') + '</div>';
  }

  var html = [
    '<button class="btn btn-secondary btn-sm" onclick="navigateTo(\'dashboard\')" style="margin-bottom:20px;">← Kembali</button>',
    '<div class="detail-layout">',

    // Left — main info
    '<div>',

    // Header card
    '<div class="card" style="margin-bottom:20px;">',
    '<div class="card-body">',
    '<div style="display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;">',
    '<div style="flex:1;">',
    multiVersi,
    '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;">',
    '<span class="badge ' + bclass + '">' + esc(r.status || 'To Do') + '</span>',
    priorityBadge(r.priority),
    '</div>',
    '<h2 style="font-size:20px;font-weight:800;margin-bottom:4px;">' + esc(r.nama_project || '-') + '</h2>',
    '<div style="font-size:12px;color:#999;font-family:monospace;">' + esc(r.request_id || '') + '</div>',
    '</div>',
    outputHtml ? '<div style="min-width:220px;">' + outputHtml + '</div>' : '',
    revisionBtn,
    '</div>',
    '</div></div>',

    // Info proyek
    '<div class="card" style="margin-bottom:20px;">',
    '<div class="card-header"><span class="card-title">📋 Informasi Proyek</span></div>',
    '<div class="card-body">',
    '<div class="detail-section-title">Detail</div>',
    '<div class="detail-grid">',
    field('Brand', brandsStr),
    field('Divisi/Tim', r.divisi || '-'),
    field('Project Code', r.project_code || '-'),
    field('Nama Client', r.nama_client || '-'),
    field('PIC Request', r.pic_name + ' &lt;' + r.pic_email + '&gt;'),
    field('Deadline', r.deadline_output ? '<strong style="color:#e53e3e;">' + r.deadline_output + '</strong>' : '-'),
    field('Platform', platform.join(', ') || '-'),
    field('Uploaded to', parseJSON(r.uploaded_to) ? parseJSON(r.uploaded_to).join(', ') : '-'),
    field('Assigned to', r.assigned_to || 'Belum diassign'),
    '</div>',
    '</div></div>',

    // Detail konten
    '<div class="card" style="margin-bottom:20px;">',
    '<div class="card-header"><span class="card-title">💡 Detail Konten</span></div>',
    '<div class="card-body">',
    field('Goals', r.goals || '-'),
    field('Headline/Judul', r.headline || '-'),
    field('Tagline', r.tagline || '-'),
    field('Key Messages', r.key_messages || '-'),
    field('Info Event/Tambahan', r.info_tambahan || '-'),
    r.event_date ? field('Tanggal Event', r.event_date + (r.event_time ? ' ' + r.event_time : '')) : '',
    r.lokasi ? field('Lokasi', r.lokasi) : '',
    r.photo_source ? '<div class="detail-field"><label>Photo Source</label><p><a href="' + r.photo_source + '" target="_blank" style="color:#3182ce;">Buka Link ↗</a></p></div>' : '',
    '</div></div>',

    // Narasumber
    (function(){
      var n = parseJSON(r.narasumber) || [];
      if (!n.length) return '';
      return '<div class="card" style="margin-bottom:20px;">' +
        '<div class="card-header"><span class="card-title">👤 Narasumber</span></div>' +
        '<div class="card-body">' +
        n.map(function(ns){ return '<div style="padding:8px 0;border-bottom:1px solid #f0f0f0;">' +
          '<strong>' + esc(ns.nama||ns) + '</strong>' +
          (ns.role ? ' <span style="color:#999;font-size:12px;">— ' + esc(ns.role) + '</span>' : '') +
          '</div>'; }).join('') + '</div></div>';
    })(),

    // Arahan desain
    '<div class="card" style="margin-bottom:20px;">',
    '<div class="card-header"><span class="card-title">🎨 Arahan Desain</span></div>',
    '<div class="card-body">',
    '<div style="display:flex;gap:10px;margin-bottom:16px;">',
    colorSwatch(r.color_primary || '#FF5E14', 'Primary'),
    colorSwatch(r.color_secondary || '#1A1A1A', 'Secondary'),
    r.color_custom ? colorSwatch(r.color_custom, 'Custom') : '',
    '</div>',
    mood.length ? '<p style="font-size:12px;color:#999;margin-bottom:6px;">Mood & Feeling:</p>' +
      '<div>' + mood.map(function(m){ return '<span style="background:#f0f0f0;padding:3px 10px;border-radius:20px;font-size:12px;margin:2px;display:inline-block;">' + esc(m) + '</span>'; }).join('') + '</div>' : '',
    r.link_referensi ? '<p style="margin-top:12px;font-size:13px;"><strong>Referensi:</strong> <a href="' + r.link_referensi + '" target="_blank" style="color:#3182ce;">' + esc(r.link_referensi) + '</a></p>' : '',
    r.catatan_designer ? '<div style="background:#fffbf0;border-left:4px solid #d69e2e;padding:12px;border-radius:0 8px 8px 0;margin-top:12px;"><strong style="font-size:12px;color:#b7791f;">Catatan untuk Designer:</strong><p style="margin-top:4px;font-size:13px;">' + esc(r.catatan_designer) + '</p></div>' : '',
    '</div></div>',

    // Deliverables
    '<div class="card" style="margin-bottom:20px;">',
    '<div class="card-header"><span class="card-title">📦 Deliverables</span></div>',
    '<div class="card-body">',
    '<div style="margin-bottom:12px;">' + (delivHtml || '-') + '</div>',
    slidesHtml ? '<div class="detail-section-title" style="margin-top:16px;">Detail Per Slide Carousel</div>' + slidesHtml : '',
    driveHtml ? '<div class="detail-section-title" style="margin-top:16px;">File Upload</div><div class="file-list">' + driveHtml + '</div>' : '',
    '</div></div>',

    // Comments
    '<div class="card">',
    '<div class="card-header"><span class="card-title">💬 Komentar & Revisi</span></div>',
    '<div class="card-body">',
    '<div class="comment-thread">' + commentsHtml + '</div>',

// ---- QUICK STATUS UPDATE ------------------------------------
function quickUpdateStatus(id, status) {
  var notes = prompt('Catatan untuk update status ke "' + status + '" (opsional):') || '';
  google.script.run
    .withSuccessHandler(function(res) {
      if (res.success) {
        showToast('Status diupdate ke ' + status, 'success');
        APP.currentRequest.status = status;
        // Refresh detail
        openRequest(id);
      } else {
        showToast('Gagal: ' + res.error, 'error');
      }
    })
    .withFailureHandler(function(e){ showToast('Error: ' + e.message, 'error'); })
    .updateStatus(id, status, notes);
}

function submitOutput(id) {
  var link  = document.getElementById('output-link-input').value.trim();
  var notes = document.getElementById('output-notes-input').value.trim();
  if (!link) { showToast('Link output wajib diisi', 'error'); return; }

  google.script.run
    .withSuccessHandler(function(res) {
      if (res.success) {
        showToast('Output berhasil dikirim!', 'success');
        openRequest(id);
      } else {
        showToast('Gagal: ' + res.error, 'error');
      }
    })
    .withFailureHandler(function(e){ showToast('Error: ' + e.message, 'error'); })
    .submitOutput(id, link, notes);
}

function submitComment(id, isRevision) {
  var text = document.getElementById('comment-text').value.trim();
  if (!text) { showToast('Komentar tidak boleh kosong', 'error'); return; }

  google.script.run
    .withSuccessHandler(function(res) {
      if (res.success) {
        showToast(isRevision ? 'Permintaan revisi terkirim!' : 'Komentar terkirim!', 'success');
        document.getElementById('comment-text').value = '';
        openRequest(id);
      } else {
        showToast('Gagal: ' + res.error, 'error');
      }
    })
    .withFailureHandler(function(e){ showToast('Error: ' + e.message, 'error'); })
    .addComment(id, text, isRevision);
}

    '</div>',

    '<div style="overflow-x:auto;">',

function renderFormStep() {
  var step = APP.form.step;

    var cls = i === step ? 'active' : (i < step ? 'done' : '');
    return '<div class="step-item ' + cls + '">' +
      '<div class="step-num">' + (i < step ? '✓' : (i+1)) + '</div>' +

      '</div>' +
      (i < STEPS.length - 1 ? '<div class="step-connector"></div>' : '');

  var content = '';

  else if (step === 1) content = renderStep1();
  else if (step === 2) content = renderStep2();
  else if (step === 3) content = renderStep3();
  else if (step === 4) content = renderStep4();

  var prevBtn = step > 0 ? '<button class="btn btn-secondary" onclick="formPrev()">← Kembali</button>' : '<button class="btn btn-secondary" onclick="navigateTo(\'dashboard\')">Batal</button>';
  var nextBtn = step < STEPS.length - 1
    ? '<button class="btn btn-primary" onclick="formNext()">Lanjut →</button>'
    : '<button class="btn btn-primary btn-lg" onclick="submitForm()">🚀 Kirim Brief</button>';

  var html = '<div class="form-stepper">' + stepsHtml + '</div>' +
    '<div class="card"><div class="card-body">' +
    content +
    '<div class="form-nav">' + prevBtn + nextBtn + '</div>' +
    '</div></div>';

  document.getElementById('page-content').innerHTML = html;
  restoreFormValues();
}

    '<div class="form-group">' + label('Waktu Event') + '<input type="time" class="form-control" id="f-event_time" value="' + (d.event_time||'') + '"></div>',
    '</div>',

    '<div class="form-group">' + label('Lokasi Event (jika ada)') +
    '<input class="form-control" id="f-lokasi" value="' + esc(d.lokasi||'') + '" placeholder="Nama venue/kota atau Online via Zoom"></div>',

    // Narasumber (dynamic)
    '<div class="form-group">',

    '<button class="btn btn-outline btn-sm" style="margin-top:8px;" onclick="addNarasumber()">+ Tambah Narasumber</button>',
    '</div>',

    '<div class="form-group">' + label('Foto/Aset (link Google Drive atau Folder foto)') +
    '<input class="form-control" id="f-photo_source" value="' + esc(d.photo_source||'') + '" placeholder="https://drive.google.com/..."></div>',

    // File upload
    '<div class="form-group">' + label('Upload File (foto, referensi, aset lainnya)') +
    '<div class="file-upload-zone" id="file-drop-zone" onclick="document.getElementById(\'file-input\').click()">' +
    '<div class="file-upload-icon">📁</div>' +
    '<div><span class="file-upload-label">Klik atau drag file ke sini</span><br><span style="font-size:12px;color:#999;">Gambar, PDF, ZIP (maks 25MB per file)</span></div>' +
    '<input type="file" id="file-input" multiple onchange="handleFileSelect(event)">' +
    '</div>' +
    '<div class="file-list" id="file-list">' + renderFilePreviews() + '</div>' +
    '</div>',

  ].join('');
}

function renderNarasumberList() {
  var list = APP.form.data.narasumber || [];
  return list.map(function(n, i) {
    return '<div style="display:flex;gap:8px;margin-bottom:8px;">' +
      '<input class="form-control" style="flex:1;" placeholder="Nama narasumber" value="' + esc(n.nama||'') + '" oninput="updateNarasumber(' + i + ',\'nama\',this.value)">' +
      '<input class="form-control" style="flex:1;" placeholder="Jabatan/Expertise" value="' + esc(n.role||'') + '" oninput="updateNarasumber(' + i + ',\'role\',this.value)">' +
      '<button class="btn btn-danger btn-sm" onclick="removeNarasumber(' + i + ')">✕</button>' +
      '</div>';
  }).join('');
}

// Step 3: Arahan Desain
function renderStep3() {
  var d = APP.form.data;
  var moodChips = MOODS.map(function(m) {

  }).join('');

  return [
    '<h3 style="font-size:16px;font-weight:700;margin-bottom:20px;">🎨 Arahan Desain</h3>',

    '<div class="form-group">',
    label('Palet Warna', true),
    '<div style="display:flex;flex-wrap:wrap;gap:16px;">',
    colorPickerField('color_primary', d.color_primary||'#FF5E14', 'Primary Color'),
    colorPickerField('color_secondary', d.color_secondary||'#1A1A1A', 'Secondary Color'),
    colorPickerField('color_custom', d.color_custom||'#FFFFFF', 'Custom Color (Opsional)'),
    '</div>',
    '</div>',

    '<div class="form-group">',
    label('Mood & Feeling'),
    '<div class="checkbox-group">' + moodChips + '</div>',
    '</div>',

    '<div class="form-group">' + label('Link Referensi Visual (Pinterest, Behance, dll)') +
    '<input class="form-control" id="f-link_referensi" value="' + esc(d.link_referensi||'') + '" placeholder="https://..."></div>',

    '<div class="form-group">' + label('Catatan Khusus untuk Designer') +
    '<textarea class="form-control" id="f-catatan_designer" placeholder="Hal spesifik yang perlu diperhatikan designer...">' + esc(d.catatan_designer||'') + '</textarea></div>',

  ].join('');
}

function colorPickerField(id, value, lbl) {
  return '<div>' +
    '<div style="font-size:12px;font-weight:600;color:#555;margin-bottom:6px;">' + lbl + '</div>' +
    '<div class="color-input-wrap">' +
    '<input type="color" class="color-swatch" id="cp-' + id + '" value="' + value + '" oninput="document.getElementById(\'ct-' + id + '\').value=this.value;saveField(\'' + id + '\',this.value)">' +
    '<input class="form-control" id="ct-' + id + '" value="' + value + '" style="font-family:monospace;max-width:120px;" oninput="syncColorPicker(\'' + id + '\',this.value)">' +
    '</div>' +
    '</div>';
}

// Step 4: Review
function renderStep4() {
  var d = APP.form.data;
  var brands = (d.brand || []).join(', ') || '-';
  var delivs = (d.deliverables || []).map(function(dv){ return typeof dv==='object'?dv.type:dv; }).join(', ') || '-';

  return [
    '<h3 style="font-size:16px;font-weight:700;margin-bottom:20px;">👁️ Review & Kirim</h3>',
    '<div style="background:#fff8f5;border:2px solid #FF5E14;border-radius:12px;padding:20px;margin-bottom:20px;">',
    '<p style="font-size:13px;font-weight:700;color:#FF5E14;margin-bottom:12px;">Pastikan semua data sudah benar sebelum dikirim:</p>',

    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">',
    reviewRow('Nama Project', d.nama_project),
    reviewRow('Brand', brands),
    reviewRow('Divisi', d.divisi),
    reviewRow('Deadline', d.deadline_output),
    reviewRow('Priority', d.priority),
    reviewRow('Goals', d.goals),
    reviewRow('Deliverables', delivs),
    reviewRow('Headline', d.headline),
    reviewRow('Color Primary', d.color_primary),
    reviewRow('Color Secondary', d.color_secondary),
    reviewRow('File yang akan diupload', APP.form.files.length + ' file'),
    reviewRow('Jumlah Slide Carousel', APP.form.slides.length > 0 ? APP.form.slides.length + ' slide' : '-'),
    d.butuh_multiple_versi ? reviewRow('Multiple Versi', (d.versi_brand||[]).join(' + ')) : '',
    '</div>',
    '</div>',

    '<div style="background:#f0fff4;border:1px solid #68d391;border-radius:10px;padding:14px;">',
    '<p style="font-size:13px;font-weight:700;color:#38a169;">📧 Email notifikasi akan dikirim ke:</p>',
    '<p style="font-size:13px;margin-top:6px;">nashihulwan@peopleshift.id, luqman@peopleshift.id, spvclass@peopleshift.id, arrabbani@peopleshift.id</p>',
    '</div>',

    '<div style="margin-top:16px;" id="submit-status"></div>',
  ].join('');
}

function reviewRow(label, val) {
  if (!val) return '';
  return '<div style="padding:6px 0;border-bottom:1px solid #f0f0f0;">' +
    '<span style="font-size:11px;color:#999;display:block;">' + label + '</span>' +
    '<span style="font-size:13px;font-weight:600;">' + esc(String(val).substring(0,80)) + '</span>' +
    '</div>';
}

// ---- FORM NAVIGATION ----------------------------------------
function formNext() {
  saveCurrentStepFields();
  if (!validateStep(APP.form.step)) return;
  APP.form.step++;
  renderFormStep();
  window.scrollTo(0,0);
}
function formPrev() {
  saveCurrentStepFields();
  APP.form.step--;
  renderFormStep();
  window.scrollTo(0,0);
}

function saveCurrentStepFields() {
  var d = APP.form.data;
  // Common text/select fields
  var fieldIds = [
    'f-nama_project','f-project_code','f-divisi','f-nama_client',
    'f-deadline_output','f-priority','f-goals',
    'f-headline','f-tagline','f-key_messages','f-info_tambahan',
    'f-event_date','f-event_time','f-lokasi','f-photo_source',
    'f-link_referensi','f-catatan_designer'
  ];
  fieldIds.forEach(function(id) {
    var el = document.getElementById(id);
    if (el) { var key = id.replace('f-',''); d[key] = el.value; }
  });
  // Colors
  ['color_primary','color_secondary','color_custom'].forEach(function(c) {
    var el = document.getElementById('ct-' + c);
    if (el) d[c] = el.value;
  });
  // Multi versi
  var mvc = document.getElementById('multi-versi-check');
  if (mvc) d.butuh_multiple_versi = mvc.checked;
}

function restoreFormValues() {
  var d = APP.form.data;
  Object.keys(d).forEach(function(k) {
    var el = document.getElementById('f-' + k);
    if (el && !['brand','platform','uploaded_to','mood_feeling','narasumber','deliverables','versi_brand'].includes(k)) {
      el.value = d[k] || '';
    }
  });
}

function validateStep(step) {
  var d = APP.form.data;
  if (step === 0) {
    if (!d.nama_project || !d.divisi || !d.deadline_output || !d.priority || !d.goals) {
      showToast('Lengkapi semua field wajib (bintang merah)', 'error'); return false;
    }
    if (!d.brand || !d.brand.length) {
      showToast('Pilih minimal 1 brand', 'error'); return false;
    }
  }
  if (step === 1) {
    if (!d.deliverables || !d.deliverables.length) {
      showToast('Pilih minimal 1 deliverable', 'error'); return false;
    }
  }
  return true;
}

// ---- SUBMIT FORM --------------------------------------------
function submitForm() {
  saveCurrentStepFields();
  if (!validateStep(APP.form.step)) return;

  var statusEl = document.getElementById('submit-status');
  if (statusEl) statusEl.innerHTML = '<div class="loading-wrap"><div class="spinner"></div> Mengunggah file & mengirim brief...</div>';

  // Process file uploads (FileReader → base64)
  var files = APP.form.files;
  var pendingUploads = [];

  function processNext(idx) {
    if (idx >= files.length) {
      doSubmit(pendingUploads);
      return;
    }
    var file = files[idx];
    var reader = new FileReader();
    reader.onload = function(e) {
      var base64 = e.target.result.split(',')[1];
      pendingUploads.push({ name: file.name, data: base64, mimeType: file.type });
      processNext(idx + 1);
    };
    reader.readAsDataURL(file);
  }
  processNext(0);
}

function doSubmit(uploadedFiles) {
  var formData = JSON.parse(JSON.stringify(APP.form.data));
  formData.carousel_slides = APP.form.slides;

  google.script.run
    .withSuccessHandler(function(res) {
      if (res.success) {
        showToast('Brief berhasil dikirim! ID: ' + res.requestId, 'success');
        APP.form = { step: 0, data: {}, slides: [], files: [] };
        loadRequests(function(){ navigateTo('dashboard'); });
      } else {
        showToast('Gagal mengirim: ' + (res.error || 'Unknown error'), 'error');
        var statusEl = document.getElementById('submit-status');
        if (statusEl) statusEl.innerHTML = '<p style="color:#e53e3e;">❌ ' + (res.error || 'Gagal mengirim') + '</p>';
      }
    })
    .withFailureHandler(function(e) {
      showToast('Error: ' + e.message, 'error');
      var statusEl = document.getElementById('submit-status');
      if (statusEl) statusEl.innerHTML = '<p style="color:#e53e3e;">❌ ' + e.message + '</p>';
    })
    .submitBrief(formData, uploadedFiles);
}

// ---- FORM HELPERS -------------------------------------------
function label(text, required) {
  return '<label class="form-label">' + text + (required ? '<span class="req">*</span>' : '') + '</label>';
}

function isSelected(key, val) {
  var arr = APP.form.data[key];
  return Array.isArray(arr) && arr.includes(val);
}

function toggleCheck(key, val) {
  var arr = APP.form.data[key] || [];
  var idx = arr.indexOf(val);
  if (idx >= 0) arr.splice(idx, 1);
  else arr.push(val);
  APP.form.data[key] = arr;
  // Re-render just the step (preserve other field values)
  saveCurrentStepFields();
  renderFormStep();
  restoreFormValues();
}

function toggleMultiVersi() {
  var panel = document.getElementById('multi-versi-panel');
  var checked = document.getElementById('multi-versi-check').checked;
  APP.form.data.butuh_multiple_versi = checked;
  if (panel) panel.style.display = checked ? 'block' : 'none';
}

function saveField(key, val) { APP.form.data[key] = val; }

function syncColorPicker(id, val) {
  APP.form.data[id] = val;
  var cp = document.getElementById('cp-' + id);
  if (cp && /^#[0-9A-Fa-f]{6}$/.test(val)) cp.value = val;
}

// Deliverables
function isDeliverableSelected(name) {
  var arr = APP.form.data.deliverables || [];
  return arr.some(function(d){ return (typeof d==='object'?d.type:d) === name; });
}

function toggleDeliverable(name) {
  var arr = APP.form.data.deliverables || [];
  var idx = arr.findIndex(function(d){ return (typeof d==='object'?d.type:d) === name; });
  if (idx >= 0) arr.splice(idx, 1);
  else arr.push({ type: name });
  APP.form.data.deliverables = arr;
  saveCurrentStepFields();
  renderFormStep();
  restoreFormValues();
}

// Slides
function addSlide() {
  APP.form.slides.push({ slide_number: APP.form.slides.length + 1, slide_type: '', headline: '', body_text: '', visual_direction: '' });
  saveCurrentStepFields();
  renderFormStep();
  restoreFormValues();
}
function removeSlide(i) {
  APP.form.slides.splice(i, 1);
  APP.form.slides.forEach(function(s,idx){ s.slide_number = idx+1; });
  saveCurrentStepFields();
  renderFormStep();
  restoreFormValues();
}
function updateSlide(i, key, val) { APP.form.slides[i][key] = val; }

// Narasumber
function addNarasumber() {
  var arr = APP.form.data.narasumber || [];
  arr.push({ nama: '', role: '' });
  APP.form.data.narasumber = arr;
  document.getElementById('narasumber-list').innerHTML = renderNarasumberList();
}
function removeNarasumber(i) {
  APP.form.data.narasumber.splice(i, 1);
  document.getElementById('narasumber-list').innerHTML = renderNarasumberList();
}
function updateNarasumber(i, key, val) {
  if (APP.form.data.narasumber && APP.form.data.narasumber[i]) {
    APP.form.data.narasumber[i][key] = val;
  }
}

// File upload
function handleFileSelect(event) {
  var newFiles = Array.from(event.target.files);
  APP.form.files = APP.form.files.concat(newFiles);
  document.getElementById('file-list').innerHTML = renderFilePreviews();
  event.target.value = '';
}
function renderFilePreviews() {
  return APP.form.files.map(function(f, i) {
    return '<div class="file-chip">📎 ' + esc(f.name) + ' <button onclick="removeFile(' + i + ')">✕</button></div>';
  }).join('');
}
function removeFile(i) {
  APP.form.files.splice(i, 1);
  var el = document.getElementById('file-list');
  if (el) el.innerHTML = renderFilePreviews();
}

// ---- TOAST --------------------------------------------------
function showToast(msg, type) {
  var container = document.getElementById('toast-container');
  if (!container) return;
  var el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  el.innerHTML = (type === 'success' ? '✅ ' : type === 'error' ? '❌ ' : 'ℹ️ ') + msg;
  container.appendChild(el);
  setTimeout(function(){ el.style.opacity = '0'; el.style.transform = 'translateX(100%)'; el.style.transition = 'all .3s'; setTimeout(function(){ el.remove(); }, 300); }, 4000);
}

// ---- UTILITIES ----------------------------------------------
function badgeClass(status) {
  if (status === 'In Progress') return 'badge-inprogress';
  if (status === 'Done') return 'badge-done';
  if (status === 'Revision') return 'badge-revision';
  return 'badge-todo';
}

function statusDotClass(status) {
  if (status === 'In Progress') return 'blue';
  if (status === 'Done') return 'green';
  if (status === 'Revision') return 'yellow';
  return 'orange';
}

function priorityBadge(p) {
  if (!p) return '';
  var cls = { 'Super Urgent': 'priority-super_urgent', 'Urgent': 'priority-urgent', 'Normal': 'priority-normal' };
  return '<span class="priority-badge ' + (cls[p]||'') + '">' + p + '</span>';
}

function parseBrand(val) {
  if (!val) return [];
  if (Array.isArray(val)) return val;
  try { var r = JSON.parse(val); return Array.isArray(r) ? r : [val]; } catch(e){ return [val]; }
}

function parseJSON(val) {
  if (!val) return null;
  if (typeof val === 'object') return val;
  try { return JSON.parse(val); } catch(e){ return null; }
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatDate(str) {
  if (!str) return '-';
  try {
    var d = new Date(str);
    return d.toLocaleDateString('id-ID', { day:'2-digit', month:'short', year:'numeric' });
  } catch(e){ return str; }
}

function formatDatetime(str) {
  if (!str) return '-';
  try {
    var d = new Date(str);
    return d.toLocaleDateString('id-ID', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
  } catch(e){ return str; }
}
</script>
